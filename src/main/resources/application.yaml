
spring:
  application:
    name: healthygation

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthygation}
    username: ${DB_USER:healthygation}
    password: ${DB_PASSWORD:healthygation}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false   # el job es llança des del trigger (JobLauncher), no en arrencar el pod
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-batch-tables.sql
  docker:
    compose:
      enabled: true
      lifecycle-management: start_only

healthygation:
    batch:
        # identifica el pod (cua de respostes step2.replies.<id>); a Kubernetes HOSTNAME = nom del pod
        instance-id: ${HOSTNAME:${random.uuid}}
    fhir:
        base-url: ${FHIR_BASE_URL:http://localhost:8085/hapi-fhir-jpaserver/fhir/}
server:
  port: ${PORT:8083}
