services:
  neo4j:
    image: neo4j:5.25.0-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/healthygation
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p healthygation 'RETURN 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15

  fhir:
    image: smartonfhir/hapi-5:r4-synthea
    ports:
      - "8085:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:fhirdb
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update


    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/hapi-fhir-jpaserver/fhir/metadata" ]
      interval: 10s
      timeout: 5s
      retries: 15