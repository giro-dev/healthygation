services:
  fhir:
    image: smartonfhir/hapi-5:r4-synthea
    ports:
      - "8085:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:fhirdb
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update


    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/hapi-fhir-jpaserver/fhir/metadata" ]
      interval: 10s
      timeout: 5s
      retries: 15

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=healthygation
      - POSTGRES_USER=healthygation
      - POSTGRES_PASSWORD=healthygation
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U healthygation" ]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
